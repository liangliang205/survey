version: '3.8'

# 适用于 1Panel 的部署示例（SQLite 最简版本）
# 使用方法：在 1Panel > 编排（或自定义应用）中新建，粘贴此内容；
# 再在 1Panel 界面里设置环境变量与宿主机卷路径。
services:
  survey-app:
    build: .
    container_name: survey-app
    restart: unless-stopped
    # 若在 1Panel 中单独配置环境变量，可删除此 environment 块
    environment:
      DATABASE_URL: file:./prisma/dev.db
      # 请修改为实际域名，例如 https://survey.example.com
      NEXTAUTH_URL: https://www.amazoncom.site
      # 请生成一个随机字符串: openssl rand -base64 32
      NEXTAUTH_SECRET: 1e45547ff236895bd44e52da3e72ddd83f4e92dd977eb2745f6dbbb3d2cf7f57
      NEXT_PUBLIC_MAX_UPLOAD_SIZE: 5242880
      NODE_ENV: production
      PORT: 3000
      # 阿里云 OSS 配置
      OSS_REGION: oss-us-west-1
      OSS_ACCESS_KEY_ID: LTAI5tCNX4aSUrRkWu4PX2S5
      OSS_ACCESS_KEY_SECRET: S5uiDiv9KKpGe88p87nJVhT1bJuB6R
      OSS_BUCKET: amazoncom-survey
      # 初始管理员密码
      ADMIN_PASSWORD: "SurveyAdmin@2025!"
      #定期删除问卷的密钥 (openssl rand -hex 32)
      CRON_SECRET: bdc6622f53538542192b29c8a899e78845b6147f55498875c6a21e605710bc11
    ports:
      - "3000:3000"
    # 注意：容器内路径必须与镜像一致（/app/...），否则数据不会生效
    volumes:
      - survey_sqlite_data:/app/prisma
      # 本地存储已移除，无需挂载 uploads 和 qrcodes 目录
      # - /data/survey/uploads:/app/public/uploads
      # - /data/survey/qrcodes:/app/public/qrcodes

  # 一次性运行：在服务首次部署后，执行迁移并写入种子数据
  migrate:
    build:
      context: .
      target: builder
    environment:
      - DATABASE_URL=file:./prisma/dev.db
      - ADMIN_PASSWORD=SurveyAdmin@2025!
    volumes:
      - survey_sqlite_data:/app/prisma
    command: sh -lc "pnpm prisma migrate deploy && pnpm db:seed"
    # 只在需要时手动运行（1Panel 中用命令或临时启动该服务）

volumes:
  survey_sqlite_data:

# 可选：如需迁移到 PostgreSQL，可在此文件中新增数据库服务：
#  postgres:
#    image: postgres:16-alpine
