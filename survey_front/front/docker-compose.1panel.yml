version: '3.8'

# 适用于 1Panel 的部署示例（SQLite 最简版本）
# 使用步骤：在 1Panel > 编排 / 任务 中新建，粘贴此文件内容（或上传），再设置环境变量与卷路径。
services:
  survey-app:
    build: .
    container_name: survey-app
    restart: unless-stopped
    # 如果在 1Panel 中单独配置环境变量，可删除 environment 块
    environment:
      DATABASE_URL: file:./prisma/dev.db
      NEXTAUTH_SECRET: change_me_before_prod
      NEXTAUTH_URL: https://your-domain.com
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    # 1Panel 中卷路径建议统一放在 /opt/data 下，可根据自己策略调整
    volumes:
      - survey_sqlite_data:/app/prisma
      - survey_uploads:/app/public/uploads
    # 健康检查（1Panel 支持自动重启，可用来辅助探测）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  survey_sqlite_data:
  survey_uploads:

