version: '3.8'

services:
  survey-app:
    # 复用主 compose 的镜像/构建与卷，用此文件覆盖生产环境变量
    environment:
      # Auth.js v5 推荐使用 AUTH_URL；保持 NEXTAUTH_URL 以兼容
      - AUTH_URL=${AUTH_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-${AUTH_URL}}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
